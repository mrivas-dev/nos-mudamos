name: Publicar en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Crea la base la primera vez y completa su id en wrangler.toml
      - name: Base de datos
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="nos-mudamos") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create nos-mudamos
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="nos-mudamos") | .uuid')
          fi
          sed -i "s/database_id = \".*\"/database_id = \"$ID\"/" wrangler.toml
          npx wrangler d1 migrations apply nos-mudamos --remote

      - name: Publicar
        run: npx wrangler deploy

      - name: Código de acceso
        env:
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: echo "$ACCESS_CODE" | npx wrangler secret put ACCESS_CODE
