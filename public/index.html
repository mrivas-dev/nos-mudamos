<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nos mudamos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div>
        <span id="conteo" class="conteo">Cargando…</span>
        <h1>Departamentos</h1>
      </div>
      <button id="agregar" class="redondo" aria-label="Agregar departamento">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <form id="form-agregar" class="agregar" hidden>
      <input id="nueva-url" type="url" inputmode="url" placeholder="Pegá el link del aviso" required>
      <button class="boton">Agregar</button>
    </form>
    <label class="buscador">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="buscar" type="search" placeholder="Buscar por barrio o título" aria-label="Buscar">
    </label>
    <div id="filtros" class="filtros"></div>
  </header>
  <main id="lista"></main>
  <p id="aviso" class="vacio" hidden></p>
</div>
<script src="app.js"></script>
</body>
</html>
